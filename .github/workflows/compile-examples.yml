name: Compile Examples

on:
  push:
    paths:
      - "src/**"
      - "examples/**"
      - "library.properties"
      - ".github/workflows/compile-examples.yml"
  pull_request:
    paths:
      - "src/**"
      - "examples/**"
      - "library.properties"
      - ".github/workflows/compile-examples.yml"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.board.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        board:
          - name: Arduino Uno
            fqbn: arduino:avr:uno
            platform: arduino:avr
          - name: Arduino Nano
            fqbn: arduino:avr:nano
            platform: arduino:avr
          - name: Arduino Nano 33 BLE
            fqbn: arduino:mbed_nano:nano33ble
            platform: arduino:mbed_nano
          - name: ESP32 Dev Module
            fqbn: esp32:esp32:esp32
            platform: esp32:esp32
            platforms-extra: |
              - name: esp32:esp32
                source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          - name: Raspberry Pi Pico
            fqbn: rp2040:rp2040:rpipico
            platform: rp2040:rp2040
            platforms-extra: |
              - name: rp2040:rp2040
                source-url: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile examples
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.board.fqbn }}
          libraries: |
            - source-path: ./
          platforms: ${{ matrix.board.platforms-extra }}
          sketch-paths: |
            - examples/01.SingleEnded_Read
            - examples/02.Differential_Read
            - examples/03.AllChannels_Scan
            - examples/04.Gain_and_DataRate
            - examples/05.SingleShot_LowPower
            - examples/06.OpenView_Streaming
          enable-deltas-report: true
          enable-warnings-report: true
