sentence=Library for the ProtoCentral tinyADC TLA2021/TLA2022/TLA2024 12-bit delta-sigma ADC breakout board.
paragraph=Drives the TI TLA2021/TLA2022/TLA2024 family of low-power 12-bit delta-sigma ADCs over I2C: single-ended and differential reads, programmable gain (PGA/FSR), 128-3300 SPS data rate, an input MUX for the 4-channel TLA2024, continuous and single-shot (low-power) modes, and helpers for converting raw counts to volts. Powers the ProtoCentral tinyADC and tinyGSR breakout boards.
